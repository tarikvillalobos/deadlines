name: deadlines

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-deadlines}
      POSTGRES_USER: ${DATABASE_USER:-deadlines}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-deadlines}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-deadlines} -d ${DATABASE_NAME:-deadlines}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-deadlines}
      DATABASE_USER: ${DATABASE_USER:-deadlines}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-deadlines}
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: [full]

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on: [api]
    restart: unless-stopped
    profiles: [full]

volumes:
  postgres-data:
